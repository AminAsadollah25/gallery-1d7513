[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # Linkvoorbeeld (PNG): deze modules laden hun eigen .wasm-bestanden, dus niet bundelen maar meenemen.
  external_node_modules = ["satori", "@resvg/resvg-wasm"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "same-origin"
