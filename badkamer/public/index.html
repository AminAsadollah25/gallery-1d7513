<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<title>Badkamer Verkooporder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=Dancing+Script:wght@500&family=Great+Vibes&family=Sacramento&display=swap">
<style>
/* Layout: Apple Store-configurator — glazen navigatiebalk, links de badkamer van de klant (licht paneel, sticky), rechts één vraag, onderaan een glazen balk met totaal en Verder.
   Huisstijl: origineel logo, antraciet #3B3A3A, merkblauw (logo #8AA3C9, verdiept tot #2E62B5 voor interactie). Bewust één licht thema, zoals apple.com en de website. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --bg2:#F5F5F7; --bg3:#ECECF0;
  --label:#1D1D1F; --label2:#6E6E73; --label3:#86868B; --sep:#D2D2D7; --hair:#E8E8ED;
  --ink:#3B3A3A;
  --brand:#8AA3C9; --accent:#2E62B5; --accent-h:#24519A; --accent-soft:#EEF3FB; --ring:rgb(46 98 181 / .22);
  --green:#1F8A4C; --orange:#B25E00; --orange-soft:#FFF4E5; --red:#D70015; --red-soft:#FFF0F1;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --fm:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --nav:52px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--label);font:17px/1.47 var(--f);letter-spacing:-.022em;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:0 0 0 4px var(--ring)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--fm);font-size:.86em;letter-spacing:0}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.km .intern{display:none!important}

/* ---------- glazen navigatie ---------- */
.nav{position:sticky;top:0;z-index:40;height:calc(var(--nav) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);background:rgb(255 255 255 / .8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgb(0 0 0 / .08)}
.nav-in{max-width:1240px;height:var(--nav);margin:0 auto;display:flex;align-items:center;gap:24px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.nav .logo{height:34px;width:auto;display:block;flex:none}
.steps{flex:1;display:flex;justify-content:center;gap:4px;min-width:0}
.stp-b{position:relative;height:var(--nav);padding:0 12px;border:0;background:none;font-size:13px;color:var(--label2);letter-spacing:-.01em;white-space:nowrap}
.stp-b:hover:not(:disabled){color:var(--label)}
.stp-b:disabled{cursor:default}
.stp-b.done{color:var(--label)}
.stp-b.done::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:2px}
.stp-b[aria-current="step"]{color:var(--label);font-weight:600}
.nav-act{display:flex;align-items:center;gap:6px;flex:none}
.icb{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--label);display:grid;place-items:center}
.icb:hover{background:var(--bg2)}
.icb[aria-pressed="true"]{background:var(--accent);color:#fff}
.icb svg.i{width:19px;height:19px}
.conn{width:8px;height:8px;border-radius:50%;background:var(--label3);flex:none}
.conn[data-s="connected"]{background:#30D158}.conn[data-s="error"],.conn[data-s="offline"]{background:#FF9F0A}
.mprog{display:none}

/* ---------- pagina ---------- */
.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(340px,440px) minmax(0,1fr);gap:72px;align-items:start;padding:40px max(22px,env(safe-area-inset-right,0px)) 150px max(22px,env(safe-area-inset-left,0px))}
.summary{position:sticky;top:calc(var(--nav) + 24px);height:calc(100vh - var(--nav) - 140px);min-height:520px;border-radius:28px;background:var(--bg2);padding:32px;display:flex;flex-direction:column;gap:22px;overflow:hidden}
.content{min-width:0;max-width:660px;width:100%}
.page{display:grid;gap:32px}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page>*,.list>*,.block>*{min-width:0}
.ph-head{display:grid;gap:12px}
.eyebrow{font-size:14px;font-weight:600;color:var(--accent);letter-spacing:-.01em}
.eyebrow span{color:var(--label3);font-weight:400}
h1{margin:0;font-size:clamp(30px,3.6vw,40px);line-height:1.1;font-weight:700;letter-spacing:-.028em;text-wrap:balance}
h1 span{color:var(--label3)}
.lead{margin:0;color:var(--label2);font-size:17px;max-width:52ch}
.block{display:grid;gap:14px}
.block-t{font-size:21px;font-weight:600;letter-spacing:-.02em}
.block-t small{display:block;font-size:15px;font-weight:400;color:var(--label2);margin-top:2px;letter-spacing:-.01em}
.km-pill{justify-self:start;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600}
.km-pill svg.i{width:15px;height:15px}

/* ---------- velden (zwevend label, zoals apple.com) ---------- */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.full{grid-column:1/-1}
.fld{display:grid;gap:6px;min-width:0;align-content:start}
.lb{font-size:14px;font-weight:600;color:var(--label)}
.lb em{font-style:normal;font-weight:400;color:var(--label3)}
.lb b{color:var(--red);font-weight:400}
.in{width:100%;height:56px;padding:0 16px;border-radius:12px;border:1px solid var(--sep);background:var(--bg);font-size:17px;transition:border-color .2s,box-shadow .2s}
.in:hover{border-color:#B0B0B8}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}
textarea.in{height:auto;min-height:140px;padding:14px 16px;resize:vertical;line-height:1.47}
.fl{position:relative}
.fl .in{padding:22px 16px 6px}
.fl label{position:absolute;left:17px;top:17px;font-size:17px;color:var(--label3);pointer-events:none;transition:all .18s cubic-bezier(.25,.1,.25,1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 34px)}
.fl .in:focus+label,.fl .in:not(:placeholder-shown)+label{top:8px;font-size:12px;color:var(--label2)}
.fl label b{color:var(--red);font-weight:400}
.fl.always label{top:8px;font-size:12px;color:var(--label2)}
.fl.eurf::before{content:"€";position:absolute;left:16px;bottom:8px;font-size:17px;color:var(--label);pointer-events:none}
.fl.eurf .in{padding-left:32px}
.fl input[type=date]{-webkit-appearance:none;appearance:none;padding-top:20px;padding-bottom:4px;line-height:1.2}
.fl input[type=date]::-webkit-date-and-time-value{text-align:left}
.fl label em{font-style:normal}
.in::placeholder{color:transparent}
.bad .in,.in.bad{border-color:var(--red);background:var(--red-soft)}
.err{font-size:13px;color:var(--red);padding-left:2px}
.hint{font-size:13px;color:var(--label2);padding-left:2px}
.eur{position:relative}.eur .in{padding-left:34px}.eur::before{content:"€";position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--label2);pointer-events:none}
.srch{position:relative}.srch svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--label3)}
.srch .in{height:56px;padding-left:50px;border-radius:14px;background:var(--bg2);border-color:transparent}
.srch .in:focus{background:var(--bg)}
.srch .in::placeholder{color:var(--label3)}

/* ---------- keuzetegels ---------- */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{position:relative;display:grid;gap:6px;align-content:start;text-align:left;padding:20px 18px;border-radius:18px;border:1px solid var(--sep);background:var(--bg);min-height:150px;transition:border-color .2s,box-shadow .2s}
.opt:hover{border-color:#A1A1A6}
.opt .ico{width:40px;height:40px;display:grid;place-items:center;color:var(--label);margin-bottom:10px}
.opt .ico svg.i{width:30px;height:30px;stroke-width:1.5}
.opt .t{font-weight:600;font-size:17px;line-height:1.25;letter-spacing:-.02em}
.opt .d{font-size:14px;color:var(--label2);line-height:1.4;letter-spacing:-.01em}
.opt .tick{position:absolute;top:16px;right:16px;width:22px;height:22px;border-radius:50%;border:1px solid var(--sep);display:grid;place-items:center;color:transparent;background:var(--bg);transition:all .2s}
.opt .tick svg.i{width:13px;height:13px;stroke-width:3}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt[aria-pressed="true"] .ico{color:var(--accent)}
.opt[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:#fff}
.pk .emb{display:block;margin-bottom:12px;transition:transform .5s var(--spring),filter .3s}

.pk[aria-pressed="true"] .emb{transform:scale(1.06)}
.pk .pk-n{font-size:22px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.pk .pk-n small{display:block;font-size:11.5px;font-weight:600;color:var(--label3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.pk[aria-pressed="true"] .pk-n small{color:var(--accent)}
.pk .price{font-size:17px;font-weight:600;margin-top:10px}


/* chips + segmented (iOS) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--sep);background:var(--bg);font-size:15px;letter-spacing:-.01em}
.chip:hover{border-color:#A1A1A6}
.chip[aria-pressed="true"]{background:var(--label);border-color:var(--label);color:#fff}
.segc{display:inline-flex;flex-wrap:wrap;background:var(--bg3);border-radius:10px;padding:2px;gap:0}
.segc button{height:34px;padding:0 14px;border:0;background:transparent;border-radius:8px;font-size:14px;font-weight:500;color:var(--label);letter-spacing:-.01em;transition:background .2s,box-shadow .2s}
.segc button[aria-pressed="true"]{background:var(--bg);box-shadow:0 3px 8px rgb(0 0 0 / .12),0 3px 1px rgb(0 0 0 / .04)}
.segc button[data-v="weet"][aria-pressed="true"]{color:var(--accent)}
.segc button[data-v="later"][aria-pressed="true"]{color:var(--orange)}
.segc button[data-v="nvt"][aria-pressed="true"]{color:var(--label2)}

/* ---------- gegroepeerde lijsten (iOS inset grouped) ---------- */
.list{display:grid;border:1px solid var(--sep);border-radius:18px;overflow:hidden;background:var(--bg)}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:66px;position:relative}
.li+.li::before,.si+.si::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--hair)}
.li .tx{flex:1;min-width:0;display:grid;gap:1px}
.li .nm{font-size:17px;overflow-wrap:anywhere}
.li .pr{font-size:14px;color:var(--label2)}
.li.on .pr{color:var(--accent)}
.li.incl .pr{color:var(--label2)}
.li .badge{font-size:13px;font-weight:500;color:var(--label2)}
.sw{position:relative;width:51px;height:31px;border-radius:999px;border:0;background:#E9E9EA;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgb(0 0 0 / .15),0 3px 1px rgb(0 0 0 / .06);transition:transform .25s cubic-bezier(.25,.1,.25,1)}
.sw[aria-pressed="true"]{background:var(--accent)}
.sw[aria-pressed="true"]::after{transform:translateX(20px)}
.qty{display:inline-flex;align-items:center;background:var(--bg3);border-radius:10px;padding:2px;flex:none}
.qty button{width:36px;height:32px;border:0;border-radius:8px;background:transparent;font-size:19px;display:grid;place-items:center;color:var(--label)}
.qty button:hover:not(:disabled){background:var(--bg)}
.qty button:disabled{color:var(--label3);cursor:default}
.qty output{min-width:28px;text-align:center;font-size:15px;font-weight:600}

/* sanitair */
.si{display:grid;gap:12px;padding:14px 16px;position:relative}
.si-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.si-top .nm{flex:1;min-width:110px;font-size:17px;display:flex;align-items:center;gap:10px}
.si-top .dot{width:8px;height:8px;border-radius:50%;background:var(--sep);flex:none;transition:background .2s}
.si[data-m="weet"] .dot{background:var(--accent)}.si[data-m="later"] .dot{background:#FF9F0A}.si[data-m="nvt"] .dot{background:var(--label3)}
.si-detail{display:grid;grid-template-columns:minmax(0,1.5fr) auto minmax(0,1fr);gap:8px;align-items:start;padding-left:18px;animation:pop .3s ease both}
.si-detail .in{height:44px;font-size:15px;border-radius:10px}
.si-detail .code{font-family:var(--fm);font-size:14px}
.si-detail .in::placeholder{color:var(--label3)}
.si-detail .qty{margin-top:4px}
.count{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:15px;color:var(--label2)}
.count b{color:var(--label);font-weight:600}
.count .chip{height:32px;font-size:13px;margin-left:auto}
.pq{display:grid;gap:6px;min-width:0}
.prod-nm{font-size:13px;color:var(--accent)}
.sug{display:grid;border:1px solid var(--sep);border-radius:12px;overflow:hidden}.sug:empty{display:none;border:0}
.sug>.hint{padding:10px 12px}
.sug button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 12px;text-align:left;padding:10px 12px;border:0;background:var(--bg);position:relative}
.sug button+button{border-top:1px solid var(--hair)}
.sug button:hover{background:var(--bg2)}
.sug b{font-weight:500;font-size:14px}.sug span{font-size:12px;color:var(--label2);grid-column:1}
.sug .mono{grid-row:1/3;grid-column:2;align-self:center;color:var(--label2)}

/* zoeken + gekoppelde klant */
.results{display:grid;border:1px solid var(--sep);border-radius:18px;overflow:hidden}.results:empty{display:none}
.res{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:0 14px;padding:12px 16px;border:0;background:var(--bg);text-align:left;position:relative}
.res+.res::before{content:"";position:absolute;top:0;left:70px;right:0;height:1px;background:var(--hair)}
.res:hover{background:var(--bg2)}
.res .av{grid-row:1/3;grid-column:1;width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#A6B6CF,#7F93B4);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px}
.res b{grid-column:2;font-weight:500;font-size:16px}.res span{grid-column:2;font-size:14px;color:var(--label2)}
.res .mono{grid-row:1/3;grid-column:3;color:var(--label3)}
.res-msg{padding:14px 16px;font-size:15px;color:var(--label2)}
.picked{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:2px 14px;padding:16px 18px;border-radius:18px;background:var(--accent-soft)}
.picked .av{grid-column:1;grid-row:1/3;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.picked .av svg.i{width:20px;height:20px}
.picked b{grid-column:2;grid-row:1;font-weight:600;font-size:17px}
.picked span{grid-column:2;grid-row:2;color:var(--label2);font-size:14px}
.picked .btn{grid-column:3;grid-row:1/3}
.divider{display:flex;align-items:center;gap:14px;color:var(--label3);font-size:14px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--hair)}

/* ---------- knoppen (pill) ---------- */
.btn{height:44px;padding:0 22px;border-radius:999px;border:0;background:var(--bg3);font-size:17px;font-weight:400;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .2s,transform .1s,opacity .2s}
.btn:hover{background:#E0E0E5}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-h)}
.btn.dark{background:var(--label);color:#fff}
.btn.dark:hover{background:#000}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.warn{background:var(--orange-soft);color:var(--orange)}
.btn.sm{height:34px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn svg.i{width:17px;height:17px}
.link{border:0;background:none;padding:0;color:var(--accent);font-size:15px}
.link:hover{text-decoration:underline}

/* ---------- glazen onderbalk ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgb(255 255 255 / .82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid rgb(0 0 0 / .08);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:14px max(22px,env(safe-area-inset-right,0px)) 14px max(22px,env(safe-area-inset-left,0px))}
.bar .tot{display:grid;gap:0;min-width:0;flex:1}
.bar .tot b{font-size:21px;font-weight:600;letter-spacing:-.02em}
.bar .tot span{font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tot span.w{color:var(--orange)}
.bar .tot .link{font-size:13px}
.bar .next{height:48px;padding:0 28px;font-size:17px;font-weight:500}

/* ---------- samenvatting (de badkamer van de klant) ---------- */
.s-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.s-top small{font-size:13px;color:var(--label2);font-weight:500}
.who{display:grid;gap:2px}
.who span{font-size:14px;color:var(--label2)}
.who b{font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.15;overflow-wrap:anywhere}
.pkgv{position:relative;flex:none;display:grid;place-items:center;height:clamp(240px,34vh,290px);padding-bottom:28px;border-radius:20px;background:var(--bg);overflow:hidden}
.pkgv::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--hair) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(var(--hair) 1px,transparent 1px) 0 0/34px 34px;opacity:.7;mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent)}
.pkgv .L{position:relative;font-size:150px;line-height:1;font-weight:700;letter-spacing:-.06em;background:linear-gradient(180deg,#5E7FB5,#2E62B5);-webkit-background-clip:text;background-clip:text;color:transparent;transition:opacity .3s}
.pkgv .ghost{position:relative;width:92px;height:92px;opacity:.14;filter:grayscale(1)}
.pkgv .cap{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:14px;color:var(--label2)}
.pkgv .cap b{color:var(--label);font-weight:600}
.vitems{display:grid;align-content:start;border-radius:16px;background:var(--bg);overflow:auto;min-height:0;flex:0 1 auto;scrollbar-width:thin}
.vit{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:15px;letter-spacing:-.01em;position:relative}
.vit+.vit::before{content:"";position:absolute;top:0;left:40px;right:0;height:1px;background:var(--hair)}
.vit svg.i{width:16px;height:16px;color:var(--accent);stroke-width:2.4}
.vit .p{margin-left:auto;color:var(--label2);white-space:nowrap}
.vit.later svg.i{color:#FF9F0A}
.vempty{font-size:15px;color:var(--label2);text-align:center;padding:6px 0}
.vtot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:6px}
.vtot small{display:block;font-size:13px;color:var(--label2);margin-bottom:2px}
.vtot .tot-v{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.vtot .aan{text-align:right;font-size:13px;color:var(--label2)}
.vtot .aan b{display:block;font-size:17px;font-weight:600;color:var(--label)}
.vhero{display:grid;gap:18px;margin-top:auto}
.vhero h2{margin:0;font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.03em}

function errText(e){
  const c=e?.code;
  if(c==="unauthorized")return "De toegangscode klopt niet meer. Laad de pagina opnieuw en log opnieuw in.";
  if(c==="config")return "De server is nog niet ingesteld: "+(e.message||"");
  if(c==="network")return "Geen verbinding met de server. Controleer het internet en probeer het opnieuw.";
  if(c==="server_unavailable")return "Airtable reageert even niet. Probeer het over een paar seconden opnieuw.";
  if(c==="tool_error"||c==="bad_request")return "Airtable gaf een foutmelding: "+String(e.message||"").slice(0,220);
  return "De verbinding met Airtable is mislukt"+(c?" ("+c+")":"")+". Probeer het opnieuw.";
}
const ambiguous=e=>["server_unavailable","network","server_error"].includes(e?.code);
const CODE_KEY="bk-toegang";

let psearch={},pseq={},ptimer={};
function runProdSearch(key,q,type){
  clearTimeout(ptimer[key]);q=String(q||"").trim();
  if(q.length<2||!data.live){psearch[key]={state:"idle",items:[]};renderSug(key);return}
  psearch[key]={state:"loading",items:psearch[key]?.items||[]};renderSug(key);
  ptimer[key]=setTimeout(async()=>{const seq=pseq[key]=(pseq[key]||0)+1;
    try{const p=await api("searchArtikel",{q});
      if(pseq[key]!==seq)return;
      const items=(p?.records||[]).filter(r=>!cell(r,ART.weg)&&["Sanitair","Tegels"].includes(cell(r,ART.groep))).map(r=>({id:r.id,code:String(cell(r,ART.code)||""),oms:String(cell(r,ART.oms)||""),groep:cell(r,ART.groep)}));
      items.sort((x,y)=>(y.groep===type)-(x.groep===type));
      psearch[key]={state:"done",items:items.slice(0,6)};
    }catch(err){if(pseq[key]!==seq)return;psearch[key]={state:"error",items:[],err:errText(err)}}
    renderSug(key)},300);
}

    <div class="sigfonts">${SIG_FONTS.map(([n,f],i)=>`<button type="button" class="sigfont" data-sigfont="${i}" aria-pressed="${(S.sigFont||0)===i&&!!S.sig}" style="font-family:${f}" aria-label="Lettertype ${n}"><span>${esc(S.sigText||k.naam||"Uw naam")}</span><small>${n}</small></button>`).join("")}</div>`
  :`<div class="sigbox ${S.sig?"has":""}" id="sigbox"><canvas id="sig" aria-label="Tekenvlak voor de handtekening"></canvas><span class="base"></span><span class="ph">${ic("pen")} Teken hier met je vinger</span></div>`}
    <div class="sig-bar"><span class="hint">${S.sigMode==="type"?"Getypte handtekening":"Getekende handtekening"} · ${esc(k.naam||"Klant")} · ${nlDate(S.orderdatum)}</span><button class="btn sm ghost" data-act="sigclear" ${S.sig?"":"disabled"}>Wissen</button></div>
    <div class="form">${inp("plaats","Plaats van ondertekening",{opt:1,ph:"Bijv. Zwijndrecht"})}</div></div>
  ${submitErr?`<div class="note err"><span><b>Niet opgeslagen.</b> ${esc(submitErr)}</span></div>`:""}
  ${!data.live?`<div class="note"><span><b>Opslaan staat uit.</b> Deze weergave is niet verbonden met Airtable.</span></div>`:""}
  <div class="intern"><button class="btn ghost" data-submit="Concept" ${busy||!data.live||mC.length?"disabled":""}>Opslaan als concept</button></div>`;
}
function pDone(){const r=result,d=r.doc;return `<div class="page"><span class="big-ok">${ic("check")}</span>
  <div class="ph-head"><div class="eyebrow">${r.status==="Getekend"?"Order geplaatst":"Concept opgeslagen"}</div><span class="hint">Ordernummer</span><div class="nr num">${esc(r.nr??"—")}</div>
  <p class="lead">${esc(d.klant.naam)} · ${eur(d.tot.tot)} incl. btw · aanbetaling ${eur(d.tot.aan)}</p></div>
  <div class="done-acts"><button class="btn primary" data-act="pdf">${ic("file")} Koopovereenkomst (PDF)</button><button class="btn" data-act="new">${ic("plus")} Nieuwe order</button><button class="btn ghost" data-act="orders">${ic("list")} Mijn orders</button></div>
  ${pdfMsg?`<span class="hint">${esc(pdfMsg)}</span>`:""}
  <p style="margin:0" class="hint">De order staat in Airtable in Badkamer orders${r.pending.length?"":", met alle regels in Badkamer orderregels"}.${d.later.length?` Nog op te volgen: ${esc(d.later.join(", "))}.`:""}</p>
  ${r.lineErr||r.delErr?`<div class="note err"><span><b>${r.lineErr?r.pending.length+" regel(s) nog niet opgeslagen.":"Oude regels konden niet worden verwijderd."}</b> ${esc(r.lineErr||r.delErr)}</span><button class="btn sm" data-act="retrylines">Opnieuw</button></div>`:""}</div>`}
function pOrders(){
  const f=UI.ordersFilter,items=orders.items.filter(o=>f==="Alle"||(f==="Kiest later"?o.later:o.status===f));
  let body;
  if(orders.state==="offline")body=`<div class="empty"><b>Niet verbonden met Airtable</b><span class="hint">Mijn orders werkt zodra Airtable verbonden is.</span></div>`;
  else if(orders.state==="loading"&&!orders.items.length)body=`<div class="skeleton"></div><div class="skeleton"></div>`;
  else if(orders.state==="error")body=`<div class="note err"><span>${esc(orders.err)}</span><button class="btn sm" data-act="orders">Opnieuw</button></div>`;
  else if(!items.length)body=`<div class="empty"><b>${orders.items.length?"Geen orders in dit filter":"Nog geen orders"}</b><span class="hint">${orders.items.length?"Kies een ander filter.":"Orders die je opslaat verschijnen hier."}</span><button class="btn primary sm" data-act="start">Order starten</button></div>`;
  else body=`<div class="olist">${items.map(o=>{const j=!!parseOrder(o);return `<div class="oc"><span class="onr">${esc(o.nr??"—")}</span><b>${esc(o.naam||"Zonder naam")}</b>
    <span class="meta"><span class="stp ${esc(o.status)}">${esc(o.status||"—")}</span><span class="num">${eur(o.totaal)}</span>${o.datum?`<span>${nlDate(o.datum)}</span>`:""}${UI.ordersAll&&o.verkoper?`<span>${esc(o.verkoper)}</span>`:""}${o.later?`<span class="later-chip">Kiest later: ${esc(o.later)}</span>`:""}</span>
    <span class="acts">${j?(o.status==="Concept"?`<button class="btn sm dark" data-open="${o.id}">Verder</button>`:"")+`<button class="btn sm" data-opdf="${o.id}">PDF</button>`:`<span class="hint">Niet via formulier</span>`}</span></div>`}).join("")}</div>`;
  return `<div class="page"><div class="ph-head"><div class="eyebrow">Overzicht</div><h1>Mijn orders. <span>Nieuwste eerst.</span></h1><p class="lead">${UI.ordersAll?"Alle badkamerorders":"Orders van "+esc(S.verkoper||"jou")}, nieuwste eerst.</p></div>
  <div class="ofilter">${["Alle","Concept","Getekend","Kiest later"].map(x=>`<button class="chip" data-ofilter="${x}" aria-pressed="${f===x}">${x}</button>`).join("")}<button class="chip" data-act="oall" aria-pressed="${UI.ordersAll}" style="margin-left:auto">Alle verkopers</button></div>
  ${pdfMsg?`<span class="hint">${esc(pdfMsg)}</span>`:""}${body}
  <div><button class="btn ghost" data-act="home">${ic("left")} Terug</button></div></div>`;
}

const KEEP_ATTR=/^(style|data-js-.*)$/;
function morph(from,to){
  if(from.tagName==="CANVAS")return;
  for(const at of [...from.attributes])if(!to.hasAttribute(at.name)&&!KEEP_ATTR.test(at.name))from.removeAttribute(at.name);
  for(const at of [...to.attributes])if(from.getAttribute(at.name)!==at.value)from.setAttribute(at.name,at.value);
  if(from.tagName==="INPUT"||from.tagName==="TEXTAREA"){
    if(document.activeElement!==from&&from.value!==to.value)from.value=to.value;
    if(from.type==="checkbox")from.checked=to.checked;return}
  const fc=[...from.childNodes],tc=[...to.childNodes];
  for(let i=0;i<tc.length;i++){const f=fc[i],t=tc[i];
    if(!f){from.appendChild(t);continue}
    if(f.nodeType!==t.nodeType||(f.nodeType===1&&(f.tagName!==t.tagName||f.getAttribute("data-key")!==t.getAttribute("data-key")))){from.replaceChild(t,f);continue}
    if(f.nodeType!==1){if(f.nodeValue!==t.nodeValue){f.nodeValue=t.nodeValue;const pe=f.parentElement;if(pe&&pe.tagName==="OUTPUT"){pe.classList.remove("bump");void pe.offsetWidth;pe.classList.add("bump")}}continue}
    morph(f,t)}
  for(let i=fc.length-1;i>=tc.length;i--)from.removeChild(fc[i]);
}
function patch(el,html){const t=el.cloneNode(false);t.innerHTML=html;morph(el,t)}

$("#gateForm").addEventListener("submit",async ev=>{ev.preventDefault();
  const i=$("#gateCode"),b=$("#gateBtn"),code=i.value.trim();if(!code)return;
  b.disabled=true;$("#gateErr").textContent="";store.set(CODE_KEY,code);
  try{await api("ping");$("#gate").hidden=true;document.body.classList.remove("locked");start()}
  catch(e){store.del(CODE_KEY);$("#gateErr").textContent=e?.code==="unauthorized"?"Deze code klopt niet.":errText(e)}
  b.disabled=false});
render();
if(store.get(CODE_KEY))start();else showGate();
</script>
</body>
</html>
